<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AbsenO - Aplikasi Presensi QR Code</title>
    <!-- Font Google: Cinzel Decorative & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- QRCodeJS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-base: #181411;
            --bg-card: #241e1a;
            --bg-glass: rgba(36, 30, 26, 0.95);
            --primary: #d4af37;
            --primary-light: #4a3b22;
            --accent: #f5eedc;
            --text-main: #f5eedc;
            --text-muted: #a39585;
            --border-color: #4a3d31;
            --nav-bg: #1c1714;
            --shadow: 0 8px 24px rgba(0,0,0,0.5);
            --font-heading: 'Cinzel Decorative', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0b0a;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg-base);
            position: relative;
            padding-bottom: 85px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Background Batik Asli */
        .batik-header-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 200px;
            background-image: linear-gradient(to bottom, rgba(24, 20, 17, 0.6), rgba(24, 20, 17, 0.98)), 
                              url('https://lh3.googleusercontent.com/d/15640024325848541640');
            background-size: cover;
            background-position: center;
            z-index: 0;
            border-bottom: 2px solid var(--primary);
        }

        header {
            position: relative;
            z-index: 1;
            padding: 26px 20px 18px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 46px;
            height: 46px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-size: 22px;
            color: var(--primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .brand-title {
            font-family: var(--font-heading);
            font-size: 24px;
            letter-spacing: 1.5px;
            color: var(--primary);
            line-height: 1.1;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .brand-subtitle {
            font-size: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-top: 3px;
        }

        main {
            position: relative;
            z-index: 1;
            padding: 0 16px;
            flex: 1;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 16px;
            color: var(--primary);
            letter-spacing: 1px;
            text-align: center;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color) !important;
            margin-top: 10px;
        }

        .scan-result-box {
            margin-top: 14px;
            padding: 12px;
            background: #14100e;
            border-radius: 10px;
            border: 1px dashed var(--border-color);
            text-align: center;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #1a1512;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .student-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        .student-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            margin-right: 12px;
            border: 1px solid var(--primary);
        }

        .action-btns { display: flex; gap: 8px; }
        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-edit { background: #1e3a8a; color: #93c5fd; }
        .btn-qr { background: #78350f; color: #fde047; }
        .btn-delete { background: #7f1d1d; color: #fca5a5; }

        .fab {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--primary);
            color: #000000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.4);
            cursor: pointer;
            z-index: 10;
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 68px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            width: 20%;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 700;
        }

        .nav-item i { font-size: 18px; margin-bottom: 4px; }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div class="batik-header-bg"></div>

    <header>
        <div class="brand-box">
            <div class="logo-icon">O</div>
            <div>
                <div class="brand-title">ABSENO</div>
                <div class="brand-subtitle">Sistem Presensi QR Code</div>
            </div>
        </div>
        <i class="fa-solid fa-crown" style="font-size: 18px; color: var(--primary);"></i>
    </header>

    <main>
        <!-- TAB 1: PINDAI -->
        <div id="tab-pindai" class="tab-content active">
            <div class="glass-card">
                <div class="section-title">Pindai QR Code Siswa</div>
                <div id="reader"></div>
                <div class="scan-result-box" id="scan-result">
                    <span style="font-size: 13px; color: var(--text-muted);">Arahkan kamera ke QR Code Kartu Siswa</span>
                </div>
            </div>
        </div>

        <!-- TAB 2: SISWA -->
        <div id="tab-siswa" class="tab-content">
            <div class="glass-card">
                <div class="section-title" style="text-align:left; margin-bottom:10px;">Data Siswa</div>
                <input type="text" id="search-siswa" class="form-control" placeholder="Cari Nama atau NIS..." oninput="renderStudentList()">
            </div>
            <div id="student-list"></div>
            <button class="fab" onclick="alert('Fitur Tambah Siswa Siap')"><i class="fa-solid fa-plus"></i></button>
        </div>

        <!-- TAB 3: JADWAL -->
        <div id="tab-jadwal" class="tab-content">
            <div class="glass-card">
                <div class="section-title">Jadwal Presensi</div>
                <p style="text-align:center; margin-top:10px; color:var(--text-muted);">Senin - Sabtu (07:00 - 14:00 WIB)</p>
            </div>
        </div>

        <!-- TAB 4: LAPORAN -->
        <div id="tab-laporan" class="tab-content">
            <div class="glass-card">
                <div class="section-title">Laporan Rekapitulasi</div>
                <button class="btn-primary" style="margin-top:14px;"><i class="fa-solid fa-file-excel"></i> Download Laporan CSV</button>
            </div>
        </div>

        <!-- TAB 5: AKUN -->
        <div id="tab-akun" class="tab-content">
            <div class="glass-card">
                <div class="section-title" style="text-align:left;">Pengaturan Apps Script</div>
                <input type="text" id="script-url" class="form-control" placeholder="URL Web App Google Apps Script..." style="margin-top:10px;">
                <button class="btn-primary" onclick="alert('URL Tersimpan!')">Simpan Pengaturan</button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('pindai', this)"><i class="fa-solid fa-qrcode"></i><span>Pindai</span></div>
        <div class="nav-item" onclick="switchTab('siswa', this)"><i class="fa-solid fa-users"></i><span>Siswa</span></div>
        <div class="nav-item" onclick="switchTab('jadwal', this)"><i class="fa-solid fa-calendar-days"></i><span>Jadwal</span></div>
        <div class="nav-item" onclick="switchTab('laporan', this)"><i class="fa-solid fa-chart-line"></i><span>Laporan</span></div>
        <div class="nav-item" onclick="switchTab('akun', this)"><i class="fa-solid fa-gear"></i><span>Akun</span></div>
    </nav>
</div>

<script>
    let students = [
        { nis: '43', nama: 'Abdul Aziz', kelas: 'XI' },
        { nis: '1', nama: 'Ahmad Ramdani', kelas: 'X-A' },
        { nis: '109691812', nama: 'Ahmad Rois Akbar', kelas: 'X-B' }
    ];

    window.onload = function() {
        renderStudentList();
        initScanner();
    };

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        el.classList.add('active');
    }

    function renderStudentList() {
        const listContainer = document.getElementById('student-list');
        const searchQuery = document.getElementById('search-siswa').value.toLowerCase();
        listContainer.innerHTML = '';

        students.filter(student => student.nama.toLowerCase().includes(searchQuery) || student.nis.includes(searchQuery))
        .forEach((student) => {
            const item = document.createElement('div');
            item.className = 'student-item';
            item.innerHTML = `
                <div class="student-avatar">${student.nama.charAt(0)}</div>
                <div style="flex:1;">
                    <div style="font-weight:600; font-size:15px;">${student.nama}</div>
                    <div style="font-size:12px; color:var(--text-muted);">${student.nis} • ${student.kelas}</div>
                </div>
                <div class="action-btns">
                    <button class="btn-icon btn-qr"><i class="fa-solid fa-qrcode"></i></button>
                    <button class="btn-icon btn-edit"><i class="fa-solid fa-pen"></i></button>
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    function initScanner() {
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } });
        html5QrcodeScanner.render((decodedText) => {
            document.getElementById('scan-result').innerHTML = `<span style="color: #4ade80; font-weight:700;">✓ QR Terbaca: ${decodedText}</span>`;
        });
    }
</script>
</body>
</html>
