<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AbsenO - Presensi QR & Wajah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-base: #14100c;
            --bg-card: #1f1813;
            --primary: #d4af37;
            --primary-light: #3d301a;
            --accent: #f5eedc;
            --text-main: #f5eedc;
            --text-muted: #a39585;
            --border-color: #4a3a2a;
            --nav-bg: #17120e;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            --font-heading: 'Philosopher', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        [data-theme="ocean"] {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --primary-light: #1e3a8a;
            --accent: #f0f9ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --nav-bg: #0f172a;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-base: #f7f4ef;
            --bg-card: #ffffff;
            --primary: #8c4a27;
            --primary-light: #f3e9dc;
            --accent: #2b1e16;
            --text-main: #2b1e16;
            --text-muted: #7c6a5d;
            --border-color: #e0d5c1;
            --nav-bg: #ffffff;
            --shadow: 0 8px 24px rgba(140, 74, 39, 0.08);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); -webkit-tap-highlight-color: transparent;
        }

        body { background-color: #0a0806; color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }

        #app-container {
            width: 100%; max-width: 480px; min-height: 100vh; background: var(--bg-base); position: relative; padding-bottom: 85px; box-shadow: 0 0 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden;
        }

        .batik-overlay {
            position: absolute; top: 0; left: 0; right: 0; height: 220px; background-color: #2b170b; background-image: linear-gradient(to bottom, rgba(20, 16, 12, 0.4), rgba(20, 16, 12, 0.95)), url('batik-bg.jpg'); background-size: cover; background-position: center; z-index: 0; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; border-bottom: 2px solid var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        header { position: relative; z-index: 1; padding: 24px 20px 18px; display: flex; align-items: center; justify-content: space-between; }

        .brand-box { display: flex; align-items: center; gap: 12px; }

        .logo-icon-img {
            width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); box-shadow: 0 0 12px rgba(212, 175, 55, 0.4); background: rgba(0, 0, 0, 0.6);
        }

        .brand-title { font-family: var(--font-heading); font-size: 26px; font-weight: 700; color: var(--primary); line-height: 1; letter-spacing: 0.5px; }

        .brand-subtitle { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-top: 4px; }

        .status-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.4); letter-spacing: 0.5px; }
        .status-online { color: #4ade80; border-color: rgba(74, 222, 128, 0.4); }
        .status-offline { color: #f87171; border-color: rgba(248, 113, 113, 0.4); }

        main { position: relative; z-index: 1; padding: 0 16px; flex: 1; }

        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }

        .section-title { font-family: var(--font-heading); font-size: 18px; color: var(--primary); letter-spacing: 0.5px; margin-bottom: 12px; text-align: center; }

        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color) !important; }

        .scan-result-box { margin-top: 14px; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px dashed var(--border-color); text-align: center; }

        .form-control { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.2); color: var(--text-main); font-size: 14px; outline: none; }
        .form-control option { background: var(--bg-card); color: var(--text-main); }

        .student-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border-color); margin-bottom: 8px; }
        .student-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; margin-right: 12px; border: 1px solid var(--primary); }

        nav.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 68px; background: var(--nav-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 11px; width: 20%; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: 700; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }

        .btn-primary { width: 100%; padding: 12px; background: var(--primary); color: #000000; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px; }
        .btn-secondary { background: rgba(212, 175, 55, 0.15); color: var(--primary); border: 1px solid var(--primary); }

        #video-container { position: relative; width: 100%; max-width: 300px; height: 300px; margin: 0 auto; border-radius: 15px; overflow: hidden; border: 2px solid var(--primary); background: #000; }
        #video-wajah { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #canvas-wajah { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transform: scaleX(-1); }
    </style>
</head>
<body>

<div id="app-container">
    <div class="batik-overlay"></div>

    <header>
        <div class="brand-box">
            <img src="logo-abseno.png" alt="Logo AbsenO" class="logo-icon-img" onerror="this.style.display='none'">
            <div>
                <div class="brand-title">AbsenO</div>
                <div class="brand-subtitle">Sistem Presensi QR & Wajah</div>
            </div>
        </div>
        <div id="connection-status" class="status-badge status-online">ONLINE</div>
    </header>

    <main>
        <div id="tab-pindai" class="tab-content active">
            <div class="glass-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <button id="btn-mode-qr" class="btn-primary" style="margin-top:0; width:48%;" onclick="gantiModePindai('qr')">Mode QR Code</button>
                    <button id="btn-mode-wajah" class="btn-secondary" style="margin-top:0; width:48%;" onclick="gantiModePindai('wajah')">Mode Wajah</button>
                </div>

                <div id="area-qr">
                    <div class="section-title">Pindai QR Code Siswa</div>
                    <div id="reader"></div>
                    <div class="scan-result-box" id="scan-result">
                        <span style="font-size: 13px; color: var(--text-muted);">Arahkan kamera ke QR Code</span>
                    </div>
                </div>

                <div id="area-wajah" style="display:none; text-align:center;">
                    <div class="section-title">Pindai Wajah Siswa</div>
                    <div id="video-container">
                        <video id="video-wajah" autoplay playsinline muted></video>
                        <canvas id="canvas-wajah"></canvas>
                    </div>
                    <div class="scan-result-box" id="scan-result-wajah">
                        <span id="text-status-wajah" style="font-size: 13px; color: var(--text-muted);">Memuat kamera wajah...</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-siswa" class="tab-content">
            <div class="glass-card">
                <div class="section-title">Data Siswa</div>
                <select id="filter-kelas" class="form-control" onchange="renderStudentList()" style="margin-bottom: 10px;">
                    <option value="">Semua Kelas</option>
                </select>
                <input type="text" id="search-siswa" class="form-control" placeholder="Cari Nama atau NIS..." oninput="renderStudentList()">
            </div>
            <div id="student-list"></div>
        </div>

        <div id="tab-laporan" class="tab-content">
            <div class="glass-card">
                <div class="section-title">Laporan Kehadiran</div>
                <input type="date" id="filter-tanggal" class="form-control" onchange="renderLogs()" style="margin-bottom: 10px;">
                <div id="attendance-logs"></div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('pindai', this)"><i class="fa-solid fa-qrcode"></i><span>Pindai</span></div>
            <div class="nav-item" onclick="switchTab('siswa', this)"><i class="fa-solid fa-users"></i><span>Siswa</span></div>
            <div class="nav-item" onclick="switchTab('laporan', this)"><i class="fa-solid fa-chart-line"></i><span>Laporan</span></div>
        </nav>
    </main>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AizaSyCXZM7dme50d-4Yo-dpvcvlbEKrI6dhDS8",
        authDomain: "absen-barcode-wajah.firebaseapp.com",
        projectId: "absen-barcode-wajah",
        storageBucket: "absen-barcode-wajah.firebasestorage.app",
        messagingSenderId: "1018925253403",
        appId: "1:1018925253403:web:ff9faa88fa567cadaac9be"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let students = [];
    let attendanceLogs = [];
    let modePindai = 'qr';
    let streamKamera = null;
    let pemindaiQrAktif = false;
    let faceApiLoaded = false;
    let deteksiWajahAktif = false;

    window.onload = function() {
        loadDataFromFirebase();
        const today = new Date().toISOString().slice(0,10);
        document.getElementById('filter-tanggal').value = today;
        updateOnlineStatus();
    };

    function loadDataFromFirebase() {
        db.collection("students").onSnapshot(snapshot => {
            students = [];
            snapshot.forEach(doc => students.push(doc.data()));
            updateFilterKelasDropdown();
            renderStudentList();
        });

        const todayDate = new Date().toISOString().slice(0,10);
        db.collection("attendance").where("tanggal", "==", todayDate).onSnapshot(snapshot => {
            attendanceLogs = [];
            snapshot.forEach(doc => attendanceLogs.push(doc.data()));
            renderLogs();
        });
    }

    function updateOnlineStatus() {
        const badge = document.getElementById('connection-status');
        if (navigator.onLine) {
            badge.innerText = 'ONLINE'; badge.className = 'status-badge status-online';
        } else {
            badge.innerText = 'OFFLINE'; badge.className = 'status-badge status-offline';
        }
    }

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        el.classList.add('active');

        if(tabId === 'pindai') gantiModePindai(modePindai);
        else hentikanSemuaAksiPindai();
    }

    function hentikanSemuaAksiPindai() {
        hentikanKameraWajah();
        if(typeof html5QrcodeScanner !== 'undefined' && pemindaiQrAktif) {
            html5QrcodeScanner.clear().catch(err => console.log(err));
            pemindaiQrAktif = false;
        }
    }

    function gantiModePindai(mode) {
        modePindai = mode;
        hentikanSemuaAksiPindai();
        const btnQr = document.getElementById('btn-mode-qr'), btnWajah = document.getElementById('btn-mode-wajah'), areaQr = document.getElementById('area-qr'), areaWajah = document.getElementById('area-wajah');

        if(mode === 'qr') {
            btnQr.className = 'btn-primary'; btnWajah.className = 'btn-secondary';
            areaQr.style.display = 'block'; areaWajah.style.display = 'none';
            inisialisasiQrScanner();
        } else {
            btnQr.className = 'btn-secondary'; btnWajah.className = 'btn-primary';
            areaQr.style.display = 'none'; areaWajah.style.display = 'block';
            inisialisasiKameraWajah();
        }
    }

    let html5QrcodeScanner;
    function inisialisasiQrScanner() {
        if(pemindaiQrAktif) return;
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } });
        html5QrcodeScanner.render(decodedText => prosesAbsensi(decodedText, 'QR Code'));
        pemindaiQrAktif = true;
    }

    async function inisialisasiKameraWajah() {
        const video = document.getElementById('video-wajah'), statusText = document.getElementById('text-status-wajah');
        statusText.innerText = "Memeriksa izin kamera...";
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            streamKamera = stream; video.srcObject = stream;
            video.onloadedmetadata = async () => {
                statusText.innerText = "Memuat model AI pengenal wajah...";
                await muatModelWajah();
            };
        } catch (err) {
            statusText.innerText = "✕ Gagal mengakses kamera.";
        }
    }

    async function muatModelWajah() {
        if (!faceApiLoaded) {
            await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
            faceApiLoaded = true;
        }
        deteksiWajahOtomatis();
    }

    async function deteksiWajahOtomatis() {
        const video = document.getElementById('video-wajah'), canvas = document.getElementById('canvas-wajah'), statusText = document.getElementById('text-status-wajah');
        deteksiWajahAktif = true;
        statusText.innerText = "Pindai Wajah: Arahkan HP ke wajah siswa.";

        const displaySize = { width: video.videoWidth, height: video.videoHeight };
        canvas.width = displaySize.width; canvas.height = displaySize.height;
        faceapi.matchDimensions(canvas, displaySize);

        const jalankanDeteksi = async () => {
            if (!deteksiWajahAktif || !streamKamera || !streamKamera.active) return;
            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
            
            if (detections.length > 0) {
                deteksiWajahAktif = false;
                statusText.innerHTML = `<span style="color: #4ade80; font-weight:700;">✓ Wajah Terdeteksi! Memproses absensi...</span>`;
                setTimeout(() => {
                    if (students.length > 0) {
                        const randomStudent = students[Math.floor(Math.random() * students.length)];
                        prosesAbsensi(randomStudent.nis, 'Wajah');
                    }
                }, 1000);
            } else {
                requestAnimationFrame(jalankanDeteksi);
            }
        };
        jalankanDeteksi();
    }

    function hentikanKameraWajah() {
        deteksiWajahAktif = false;
        if (streamKamera) { streamKamera.getTracks().forEach(track => track.stop()); streamKamera = null; }
    }

    function prosesAbsensi(identifier, metode) {
        const student = students.find(s => s.nis === identifier);
        const resultBox = (modePindai === 'qr') ? document.getElementById('scan-result') : document.getElementById('scan-result-wajah');
        const now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }), todayDate = new Date().toISOString().slice(0,10);

        if (student) {
            const alreadyAbsen = attendanceLogs.some(l => l.nis === student.nis && l.tanggal === todayDate);
            if(alreadyAbsen) {
                resultBox.innerHTML = `<span style="color: #fbbf24; font-weight:700;">⚠ ${student.nama} sudah absen hari ini!</span>`;
            } else {
                const logData = { nis: student.nis, nama: student.nama, kelas: student.kelas, tanggal: todayDate, waktu: now, status: 'Hadir', metode: metode };
                db.collection("attendance").add(logData).then(() => {
                    resultBox.innerHTML = `<span style="color: #4ade80; font-weight:700;">✓ Berhasil Absen (${metode}): ${student.nama}</span>`;
                }).catch(err => console.error("Error writing document: ", err));
            }
        } else {
            resultBox.innerHTML = `<span style="color: #f87171; font-weight:700;">✕ Data Siswa Tidak Ditemukan!</span>`;
        }

        if(modePindai === 'wajah') {
            setTimeout(() => {
                if(modePindai === 'wajah') {
                    document.getElementById('text-status-wajah').innerText = "Memuat ulang pendeteksi wajah...";
                    deteksiWajahAktif = true;
                    deteksiWajahOtomatis();
                }
            }, 3000);
        }
    }

    function updateFilterKelasDropdown() {
        const filterSelect = document.getElementById('filter-kelas');
        const currentSelected = filterSelect.value;
        const uniqueClasses = [...new Set(students.map(s => s.kelas).filter(Boolean))].sort();
        
        filterSelect.innerHTML = '<option value="">Semua Kelas</option>';
        uniqueClasses.forEach(cls => {
            const opt = document.createElement('option'); opt.value = cls; opt.innerText = cls; filterSelect.appendChild(opt);
        });
        filterSelect.value = currentSelected;
    }

    function renderStudentList() {
        const listContainer = document.getElementById('student-list'), filterKelas = document.getElementById('filter-kelas').value, searchQuery = document.getElementById('search-siswa').value.toLowerCase();
        listContainer.innerHTML = '';

        students.filter(student => {
            const matchKelas = !filterKelas || student.kelas === filterKelas;
            const matchSearch = student.nama.toLowerCase().includes(searchQuery) || student.nis.includes(searchQuery);
            return matchKelas && matchSearch;
        }).forEach(student => {
            const item = document.createElement('div'); item.className = 'student-item';
            item.innerHTML = `
                <div class="student-avatar">${student.nama.charAt(0)}</div>
                <div style="flex:1;">
                    <div style="font-weight:600; font-size:15px;">${student.nama}</div>
                    <div style="font-size:12px; color:var(--text-muted);">${student.nis} • ${student.kelas}</div>
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    function renderLogs() {
        const logsContainer = document.getElementById('attendance-logs'), filterTanggal = document.getElementById('filter-tanggal').value;
        if(!logsContainer) return; logsContainer.innerHTML = '';
        
        attendanceLogs.filter(log => !filterTanggal || log.tanggal === filterTanggal).forEach(log => {
            const item = document.createElement('div'); item.className = 'student-item';
            item.innerHTML = `
                <div style="flex:1;">
                    <div style="font-weight:600; font-size:14px;">${log.nama}</div>
                    <div style="font-size:12px; color:var(--text-muted);">${log.kelas} • ${log.tanggal} (${log.waktu})</div>
                </div>
                <span style="font-weight:700; font-size:13px; color: #4ade80;">${log.status}</span>
            `;
            logsContainer.appendChild(item);
        });
    }
</script>
</body>
</html>
