name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @pwabuilder/bubblewrap

      - name: Build Android App Manifest & APK
        run: |
          bubblewrap init --manifest=https://wil-hack.github.io/Absen-barcode/manifest.json --directory=android-app || true
          cd android-app || mkdir -p android-app && cd android-app
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: AbsenO-APK
          path: android-app/app/build/outputs/apk/release/*.apk
