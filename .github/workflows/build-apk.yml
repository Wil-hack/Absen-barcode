name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App Artifacts
        run: |
          echo "Menyiapkan aset web AbsenO untuk dikemas..."
          mkdir -p output-apk
          # Menyalin file web utama sebagai arsip instalasi
          cp index.html output-apk/index.html || true

      - name: Upload APK / Web Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbsenO-PWA-Package
          path: output-apk/
