name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create my-app com.abseno.app AbsenO
        cd my-app
        cordova platform add android

    - name: Copy Web Files & Configure App
      run: |
        # Menyalin file index.html ke folder www proyek Cordova
        cp index.html my-app/www/index.html
        cd my-app

        # Plugin penting untuk ekspor file CSV & fitur pendukung
        cordova plugin add cordova-plugin-file
        cordova plugin add cordova-plugin-file-transfer
        cordova plugin add cordova-plugin-x-socialsharing

    - name: Build APK with Cordova
      run: |
        cd my-app
        cordova build android --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: AbsenO-APK
        path: my-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
