name: Build AbsenO APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova Global
      run: npm install -g cordova

    - name: Create and Build Android APK
      run: |
        cordova create myApp com.abseno.app AbsenO
        
        # Menghapus folder www bawaan kosong
        rm -rf myApp/www/*
        
        # Menyalin seluruh file proyek web
        cp -r ./* myApp/www/ 2>/dev/null || true
        
        # Membersihkan file sistem github/workflow dari folder www
        rm -rf myApp/www/.github myApp/www/myApp myApp/www/platforms myApp/www/plugins myApp/www/node_modules
        
        cd myApp
        
        # Hapus plugin splashscreen
        cordova plugin rm cordova-plugin-splashscreen --save || true

        # Config.xml bersih tanpa splash screen
        cat <<EOT > config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.abseno.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>AbsenO</name>
            <description>Sistem Presensi AbsenO</description>
            <author email="admin@abseno.com">AbsenO Team</author>
            <content src="index.html" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <preference name="BackgroundColor" value="#14100c" />
            <platform name="android">
                <icon src="www/logo-abseno.png" />
            </platform>
        </widget>
        EOT

        cordova platform add android
        
        # Buat file gambar hitam kosong berukuran kecil menggunakan ImageMagick untuk menimpa semua gambar splash bawaan
        sudo apt-get update && sudo apt-get install -y imagemagick
        convert -size 100x100 xc:#14100c dummy_splash.png
        
        # Timpa semua file gambar yang mengandung kata splash atau screen di folder android resources
        find platforms/android/app/src/main/res -name "*splash*" -type f -exec cp dummy_splash.png {} \; || true
        find platforms/android/app/src/main/res -name "*screen*" -type f -exec cp dummy_splash.png {} \; || true
        
        # Injeksi Izin Android
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.VIBRATE" />' platforms/android/app/src/main/AndroidManifest.xml
        
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AbsenO-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
